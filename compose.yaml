services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vorcarozap_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8090}:8080"
    environment:
      - APP_PORT=8080
      - APP_ENV=${APP_ENV:-development}
      - DB_PATH=/data/vorcarozap.db
    volumes:
      - vorcarozap_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  caddy:
    image: caddy:2-alpine
    container_name: vorcarozap_caddy
    restart: unless-stopped
    profiles:
      - proxy
    ports:
      - "${CADDY_HTTP_PORT:-8000}:80"
      - "${CADDY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  vorcarozap_data:
  caddy_data:
  caddy_config:
