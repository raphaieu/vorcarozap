services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vorcarozap_app
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8090}:8080"
    environment:
      APP_PORT: "8080"
      APP_ENV: ${APP_ENV:-development}
      DB_PATH: /data/vorcarozap.db
      PUBLIC_DATA_CUTOFF: ${PUBLIC_DATA_CUTOFF:-2026-09-03}
      SOURCE_NOT_CHECKED_POLICY_OPENROUTER: ${SOURCE_NOT_CHECKED_POLICY_OPENROUTER:-quarantine}
      SOURCE_NOT_CHECKED_POLICY_CURATED_SEED: ${SOURCE_NOT_CHECKED_POLICY_CURATED_SEED:-allow}
      SOURCE_CHECK_TIMEOUT: ${SOURCE_CHECK_TIMEOUT:-5s}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1/chat/completions}
      OPENROUTER_DISCOVERY_MODEL: ${OPENROUTER_DISCOVERY_MODEL:-openai/gpt-4.1-mini}
      OPENROUTER_VERIFICATION_MODEL: ${OPENROUTER_VERIFICATION_MODEL:-openai/gpt-4.1-mini}
      OPENROUTER_TIMEOUT: ${OPENROUTER_TIMEOUT:-30s}
      OPENROUTER_WEB_SEARCH_ENGINE: ${OPENROUTER_WEB_SEARCH_ENGINE:-auto}
      OPENROUTER_WEB_SEARCH_MAX_RESULTS: ${OPENROUTER_WEB_SEARCH_MAX_RESULTS:-5}
      OPENROUTER_WEB_SEARCH_MAX_TOTAL_RESULTS: ${OPENROUTER_WEB_SEARCH_MAX_TOTAL_RESULTS:-15}
      OPENROUTER_WEB_SEARCH_MAX_USES: ${OPENROUTER_WEB_SEARCH_MAX_USES:-3}
      OPENROUTER_MAX_TOOL_CALLS: ${OPENROUTER_MAX_TOOL_CALLS:-5}
      MONITOR_WINDOW: ${MONITOR_WINDOW:-24h}
      MONITOR_MAX_CANDIDATES_PER_RUN: ${MONITOR_MAX_CANDIDATES_PER_RUN:-10}
      MONITOR_MAX_VERIFICATIONS_PER_RUN: ${MONITOR_MAX_VERIFICATIONS_PER_RUN:-10}
      MONITOR_MAX_COST_PER_RUN_USD: ${MONITOR_MAX_COST_PER_RUN_USD:-0.25}
      MONITOR_MAX_COST_PER_DAY_USD: ${MONITOR_MAX_COST_PER_DAY_USD:-1.00}
      MONITOR_LOCK_TTL: ${MONITOR_LOCK_TTL:-10m}
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_ALLOWED_ORIGIN: ${ADMIN_ALLOWED_ORIGIN:-}
      ADMIN_SESSION_TTL: ${ADMIN_SESSION_TTL:-8h}
      ADMIN_LOCKOUT_DURATION: ${ADMIN_LOCKOUT_DURATION:-15m}
      ADMIN_MAX_LOGIN_ATTEMPTS: ${ADMIN_MAX_LOGIN_ATTEMPTS:-5}
      ADMIN_MFA_REQUIRED: ${ADMIN_MFA_REQUIRED:-true}
      ADMIN_MFA_ENCRYPTION_KEY: ${ADMIN_MFA_ENCRYPTION_KEY:-}
      LOG_FORMAT: ${LOG_FORMAT:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BACKUP_REMOTE_ENABLED: ${BACKUP_REMOTE_ENABLED:-false}
      BACKUP_REMOTE_PROVIDER: ${BACKUP_REMOTE_PROVIDER:-s3}
      BACKUP_REMOTE_ENDPOINT: ${BACKUP_REMOTE_ENDPOINT:-https://s3.us-east-1.amazonaws.com}
      BACKUP_REMOTE_REGION: ${BACKUP_REMOTE_REGION:-us-east-1}
      BACKUP_REMOTE_BUCKET: ${BACKUP_REMOTE_BUCKET:-}
      BACKUP_REMOTE_PREFIX: ${BACKUP_REMOTE_PREFIX:-backups}
      BACKUP_REMOTE_ACCESS_KEY: ${BACKUP_REMOTE_ACCESS_KEY:-}
      BACKUP_REMOTE_SECRET_KEY: ${BACKUP_REMOTE_SECRET_KEY:-}
      BACKUP_REMOTE_RETENTION_COUNT: ${BACKUP_REMOTE_RETENTION_COUNT:-14}
      BACKUP_REMOTE_TIMEOUT: ${BACKUP_REMOTE_TIMEOUT:-60s}
    volumes:
      - vorcarozap_data:/data
      - vorcarozap_backups:/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    working_dir: /src
    environment:
      APP_PORT: "8080"
      APP_ENV: ${APP_ENV:-development}
      DB_PATH: /data/vorcarozap.db
      PUBLIC_DATA_CUTOFF: ${PUBLIC_DATA_CUTOFF:-2026-09-03}
      SOURCE_NOT_CHECKED_POLICY_OPENROUTER: ${SOURCE_NOT_CHECKED_POLICY_OPENROUTER:-quarantine}
      SOURCE_NOT_CHECKED_POLICY_CURATED_SEED: ${SOURCE_NOT_CHECKED_POLICY_CURATED_SEED:-allow}
      SOURCE_CHECK_TIMEOUT: ${SOURCE_CHECK_TIMEOUT:-5s}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1/chat/completions}
      OPENROUTER_DISCOVERY_MODEL: ${OPENROUTER_DISCOVERY_MODEL:-openai/gpt-4.1-mini}
      OPENROUTER_VERIFICATION_MODEL: ${OPENROUTER_VERIFICATION_MODEL:-openai/gpt-4.1-mini}
      OPENROUTER_TIMEOUT: ${OPENROUTER_TIMEOUT:-30s}
      OPENROUTER_WEB_SEARCH_ENGINE: ${OPENROUTER_WEB_SEARCH_ENGINE:-auto}
      OPENROUTER_WEB_SEARCH_MAX_RESULTS: ${OPENROUTER_WEB_SEARCH_MAX_RESULTS:-5}
      OPENROUTER_WEB_SEARCH_MAX_TOTAL_RESULTS: ${OPENROUTER_WEB_SEARCH_MAX_TOTAL_RESULTS:-15}
      OPENROUTER_WEB_SEARCH_MAX_USES: ${OPENROUTER_WEB_SEARCH_MAX_USES:-3}
      OPENROUTER_MAX_TOOL_CALLS: ${OPENROUTER_MAX_TOOL_CALLS:-5}
      MONITOR_WINDOW: ${MONITOR_WINDOW:-24h}
      MONITOR_MAX_CANDIDATES_PER_RUN: ${MONITOR_MAX_CANDIDATES_PER_RUN:-10}
      MONITOR_MAX_VERIFICATIONS_PER_RUN: ${MONITOR_MAX_VERIFICATIONS_PER_RUN:-10}
      MONITOR_MAX_COST_PER_RUN_USD: ${MONITOR_MAX_COST_PER_RUN_USD:-0.25}
      MONITOR_MAX_COST_PER_DAY_USD: ${MONITOR_MAX_COST_PER_DAY_USD:-1.00}
      MONITOR_LOCK_TTL: ${MONITOR_LOCK_TTL:-10m}
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_ALLOWED_ORIGIN: ${ADMIN_ALLOWED_ORIGIN:-}
      ADMIN_SESSION_TTL: ${ADMIN_SESSION_TTL:-8h}
      ADMIN_LOCKOUT_DURATION: ${ADMIN_LOCKOUT_DURATION:-15m}
      ADMIN_MAX_LOGIN_ATTEMPTS: ${ADMIN_MAX_LOGIN_ATTEMPTS:-5}
      ADMIN_MFA_REQUIRED: ${ADMIN_MFA_REQUIRED:-true}
      ADMIN_MFA_ENCRYPTION_KEY: ${ADMIN_MFA_ENCRYPTION_KEY:-}
      LOG_FORMAT: ${LOG_FORMAT:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BACKUP_REMOTE_ENABLED: ${BACKUP_REMOTE_ENABLED:-false}
      BACKUP_REMOTE_PROVIDER: ${BACKUP_REMOTE_PROVIDER:-s3}
      BACKUP_REMOTE_ENDPOINT: ${BACKUP_REMOTE_ENDPOINT:-https://s3.us-east-1.amazonaws.com}
      BACKUP_REMOTE_REGION: ${BACKUP_REMOTE_REGION:-us-east-1}
      BACKUP_REMOTE_BUCKET: ${BACKUP_REMOTE_BUCKET:-}
      BACKUP_REMOTE_PREFIX: ${BACKUP_REMOTE_PREFIX:-backups}
      BACKUP_REMOTE_ACCESS_KEY: ${BACKUP_REMOTE_ACCESS_KEY:-}
      BACKUP_REMOTE_SECRET_KEY: ${BACKUP_REMOTE_SECRET_KEY:-}
      BACKUP_REMOTE_RETENTION_COUNT: ${BACKUP_REMOTE_RETENTION_COUNT:-14}
      BACKUP_REMOTE_TIMEOUT: ${BACKUP_REMOTE_TIMEOUT:-60s}
    volumes:
      - .:/src
      - go_modules:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    profiles:
      - dev

  caddy:
    image: caddy:2-alpine
    container_name: vorcarozap_caddy
    restart: unless-stopped
    profiles:
      - prod
      - proxy
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  vorcarozap_data:
  vorcarozap_backups:
  caddy_data:
  caddy_config:
  go_modules:
  go_build_cache:
