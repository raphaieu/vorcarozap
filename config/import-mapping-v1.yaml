version: import-mapping-v1
origin: curated_seed

source:
  sheet: "Pessoas A-Z"
  header_row: 6
  legacy_grade_column: "Grau de confirmação"

legacy_grade_mapping:
  "A — direto confirmado":
    grade: "A"
    initial_state: "published"
    disposition: "supports_link"
    metric_eligible: true
  "B — direto documentado/controvertido":
    grade: "B"
    initial_state: "published"
    disposition: "supports_link"
    metric_eligible: true
  "C — agenda apenas":
    grade: "C"
    initial_state: "published"
    disposition: "supports_link"
    metric_eligible: true
  "D — indireto/potencial":
    grade: "D"
    initial_state: "published"
    disposition: "possible_link"
    metric_eligible: true
  "E — fraco/ambíguo":
    grade: "E"
    initial_state: "quarantined"
    disposition: "possible_link"
    metric_eligible: false
  "E — fraco/corrigido":
    grade: "E"
    initial_state: "published"
    disposition: "context_only"
    metric_eligible: false

unmapped_grade_action: quarantined

initial_state:
  publish_requires:
    - identifiable_name
    - role_or_context
    - relationship_explanation
    - primary_source
    - recognized_legacy_grade
    - claim_does_not_overstate_source
  quarantine_on:
    - missing_source
    - ambiguous_identity
    - unmappable_legacy_grade
    - claim_overstates_source
    - missing_essential_data
